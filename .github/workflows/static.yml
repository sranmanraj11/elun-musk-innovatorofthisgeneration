<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elon Musk — The Greatest Entrepreneur</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #0f172a;
            color: white;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(90deg, #0ea5e9, #6366f1);
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 3em;
        }

        header p {
            font-size: 1.2em;
        }

        nav {
            background-color: #1e293b;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: #38bdf8;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: white;
        }

        section {
            padding: 40px 20px;
            max-width: 900px;
            margin: auto;
        }

        h2 {
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
            padding-bottom: 5px;
        }

        .card {
            background-color: #1e293b;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }

        footer {
            background-color: #1e293b;
            text-align: center;
            padding: 20px;
            font-size: 0.9em;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<header>
    <h1>Elon Musk</h1>
    <p>The Greatest Entrepreneur of All Time 🚀</p>
</header>

<nav>
    <a href="#about">About</a>
    <a href="#companies">Companies</a>
    <a href="#impact">Impact</a>
    <a href="#why">Why the Greatest?</a>
</nav>

<section id="about">
    <h2>About Elon Musk</h2>
    <p>
        Elon Musk is a technology entrepreneur, inventor, and business leader known for
        creating and leading some of the most innovative companies in the world. His goal
        is to solve big global problems like climate change, transportation, and making
        life multiplanetary.
    </p>
</section>

<section id="companies">
    <h2>Companies He Founded or Leads</h2>

    <div class="card">
        <h3>🚗 Tesla</h3>
        <p>
            Tesla designs electric cars and clean energy products. It helped make electric
            vehicles popular around the world and pushed the car industry toward renewable energy.
        </p>
    </div>

    <div class="card">
        <h3>🚀 SpaceX</h3>
        <p>
            SpaceX builds rockets and spacecraft. It became the first private company to send
            astronauts to space and is working to make human life possible on Mars.
        </p>
    </div>

    <div class="card">
        <h3>🧠 Neuralink</h3>
        <p>
            Neuralink is developing brain-computer interface technology that may one day help
            people with paralysis and neurological conditions.
        </p>
    </div>

    <div class="card">
        <h3>🚇 The Boring Company</h3>
        <p>
            This company works on underground transportation tunnels to reduce traffic congestion
            in major cities.
        </p>
    </div>
</section>

<section id="impact">
    <h2>Global Impact</h2>
    <p>
        Elon Musk has changed multiple industries at once — cars, space travel, energy, and
        artificial intelligence. His work has encouraged other companies to innovate faster
        and focus on solving real-world problems. Millions of people now drive electric cars,
        and space travel is becoming more affordable because of his companies.
    </p>
</section>

<section id="why">
    <h2>Why He Is the Greatest Entrepreneur</h2>
    <ul>
        <li>He takes huge risks to solve world problems</li>
        <li>He leads multiple revolutionary companies at the same time</li>
        <li>He inspires innovation and future technology</li>
        <li>He focuses on long-term goals like sustainable energy and Mars exploration</li>
    </ul>
</section>

<footer>
    <p>Website created for school project | Greatest Entrepreneur Assignment</p>
</footer>

</body>
</html>

